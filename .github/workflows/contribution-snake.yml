name: Generate contribution snake

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23dc2626&color_dots=%23fffef7%2C%23fffdf0%2C%23fff9d9%2C%23fff3b0%2C%23ffe680&color_background=%23fffef7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff453a&color_background=%23161b22

      - name: Publish animation assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
